  background:
   radial-gradient(ellipse 70% 55% at 50% 50%,rgba(43,23,4,.58),rgba(43,23,4,.22) 60%,transparent 85%),
   radial-gradient(ellipse at 50% 100%,rgba(43,23,4,.25),transparent 60%)}

/* Слои эффектов */
.fx{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.spark{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;
  background:#fff3c4;box-shadow:0 0 calc(var(--s)*3) calc(var(--s)*.8) rgba(255,205,100,.7);
  opacity:0;animation:twinkle var(--d) ease-in-out var(--t) infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1.1)}}

/* Листья: fall → sway → spin (только transform, GPU-friendly) */
.leaf{position:absolute;left:0;top:0;width:var(--size);height:var(--size);color:var(--c);opacity:var(--o);
  will-change:transform;animation:fall var(--fd) linear var(--delay,0s) infinite backwards}
.sway{width:100%;height:100%;animation:sway var(--sd) ease-in-out var(--sdl,0s) infinite alternate}
.spin{display:block;width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 2px 3px rgba(60,25,0,.35));
  animation:spin var(--rd) linear infinite var(--dir,normal)}
@keyframes fall{
  from{transform:translate3d(var(--x),calc(var(--size) * -2),0)}
  to{transform:translate3d(calc(var(--x) + var(--drift)),calc(100vh + var(--size) * 2),0)}}
@keyframes sway{
  from{transform:translate3d(calc(var(--amp) * -1),0,0)}
  to{transform:translate3d(var(--amp),0,0)}}
@keyframes spin{
  from{transform:rotateZ(0) rotateX(20deg) rotateY(0)}
  50%{transform:rotateZ(180deg) rotateX(70deg) rotateY(25deg)}
  to{transform:rotateZ(360deg) rotateX(20deg) rotateY(0)}}

/* Контент */
.stage{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));text-align:center}
.content{will-change:transform;max-width:100%}
.title{margin:0;font-family:var(--font-title);font-weight:700;text-transform:uppercase;
  font-size:clamp(2.1rem,9.2vw,6.6rem);line-height:1.08;letter-spacing:.08em;
  display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:.05em .35em;
  filter:drop-shadow(0 2px 2px rgba(43,23,4,.75)) drop-shadow(0 0 22px rgba(255,190,80,.55))}
.title span{background:linear-gradient(100deg,#fff1c9 0%,#ffd57a 30%,#f3a735 50%,#ffe9ae 70%,#ffd57a 100%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;animation:shimmer 9s ease-in-out infinite alternate}
.title .amp{font-size:.7em;font-weight:500}
@keyframes shimmer{from{background-position:0% 0}to{background-position:100% 0}}
.divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:clamp(14px,2.4vw,26px) auto;
  width:min(380px,70vw)}
.divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.divider b{width:9px;height:9px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 12px 2px rgba(255,200,90,.8)}
.subtitle{margin:0;font-family:var(--font-sub);font-style:italic;font-weight:600;
  font-size:clamp(1.15rem,3.6vw,2.1rem);letter-spacing:.04em;color:var(--cream);
  text-shadow:0 1px 3px rgba(43,23,4,.9),0 0 18px rgba(255,190,80,.6)}

/* Появление при загрузке */
.reveal{opacity:0;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--rd,.3s)}
.title.reveal{animation-name:riseTitle}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes riseTitle{from{opacity:0;transform:translateY(18px) scale(.96);letter-spacing:.2em}
  to{opacity:1;transform:none;letter-spacing:.08em}}

@media (max-width:480px){.title{letter-spacing:.05em}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}
  .reveal{opacity:1}
  .spark{opacity:.6}
  .leaf{display:none}
}
</style>
</head>
<body>
<div class="bg" id="bg" role="img" aria-label="Осенние кленовые листья в золотистом свете"></div>
<div class="veil"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="maple" viewBox="0 0 100 100">
    <path fill="currentColor" d="M50 2 58 20 72 13 68 34 88 29 80 46 98 52 78 62 84 75 62 70 55 90 55 99 45 99 45 90 38 70 16 75 22 62 2 52 20 46 12 29 32 34 28 13 42 20Z"/>
    <path fill="none" stroke="rgba(70,25,0,.35)" stroke-width="1.6" stroke-linecap="round"
      d="M50 96V30M50 70 22 56M50 70 78 56M50 52 30 36M50 52 70 36"/>
  </symbol>
</svg>

<div class="fx" id="sparks" aria-hidden="true"></div>
<div class="fx" id="leaves" aria-hidden="true"></div>

<main class="stage">
  <div class="content" id="content">
    <h1 class="title reveal" style="--rd:.3s" aria-label="Mister &amp; Miss 83">
      <span>Mister</span><span class="amp">&amp;</span><span>Miss&nbsp;83</span>
    </h1>
    <div class="divider reveal" style="--rd:1.1s" aria-hidden="true"><i></i><b></b><i></i></div>
    <p class="subtitle reveal" style="--rd:1.5s">Осень. Красота. Талант. Элегантность.</p>
  </div>
</main>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var rnd = function(a,b){return a + Math.random()*(b-a)};
  var pick = function(arr){return arr[Math.floor(Math.random()*arr.length)]};
  var small = window.innerWidth < 600;

  /* Световые частицы */
  var sparks = document.getElementById("sparks"), sf = document.createDocumentFragment();
  for (var i=0;i<(small?18:34);i++){
    var s = document.createElement("div"); s.className = "spark";
    s.style.cssText = "--x:"+rnd(0,100)+"%;--y:"+rnd(0,100)+"%;--s:"+rnd(2,5).toFixed(1)+"px;--d:"+rnd(3,7).toFixed(1)+"s;--t:-"+rnd(0,7).toFixed(1)+"s";
    sf.appendChild(s);
  }
  sparks.appendChild(sf);

  /* Листья */
  var palette = ["#f4c430","#e9a825","#f0b13a","#ef8a1f","#e06a14","#c8401a","#b3301a","#9b5a22","#7a4318","#d9922b"];
  function setup(el, first){
    var vw = window.innerWidth;
    var size = small ? rnd(16,38) : rnd(20,56);
    var fd = rnd(10,22) * (0.7 + size/90);          // крупные «ближе» и чуть быстрее
    el.style.setProperty("--size", size.toFixed(0)+"px");
    el.style.setProperty("--x", rnd(-5,100).toFixed(1)+"vw");
    el.style.setProperty("--drift", rnd(-18,18).toFixed(1)+"vw");
    el.style.setProperty("--fd", fd.toFixed(1)+"s");
    el.style.setProperty("--amp", rnd(14,60).toFixed(0)+"px");
    el.style.setProperty("--sd", rnd(2.4,5).toFixed(1)+"s");
    el.style.setProperty("--rd", rnd(4,10).toFixed(1)+"s");
    el.style.setProperty("--dir", Math.random()<.5 ? "normal" : "reverse");
    el.style.setProperty("--c", pick(palette));
    el.style.setProperty("--o", rnd(.78,1).toFixed(2));
    // Задержки задаём только один раз при создании: смена delay у работающей анимации вызывает скачок
    if (first){
      el.style.setProperty("--delay", rnd(0,9).toFixed(1)+"s");
      el.style.setProperty("--sdl", "-"+rnd(0,4).toFixed(1)+"s");
    }
  }
  if (!reduce){
    var box = document.getElementById("leaves"), lf = document.createDocumentFragment();
    var n = small ? 14 : 24;
    for (var j=0;j<n;j++){
      var leaf = document.createElement("div"); leaf.className = "leaf";
      leaf.innerHTML = '<div class="sway"><svg class="spin" viewBox="0 0 100 100"><use href="#maple"/></svg></div>';
      setup(leaf, true);
      lf.appendChild(leaf);
    }
    box.appendChild(lf);
    // Лист ушёл за нижний край → новые параметры, тот же элемент (DOM не растёт)
    box.addEventListener("animationiteration", function(e){
      if (e.animationName === "fall" && e.target.classList.contains("leaf")) setup(e.target, false);
    });
  }

  /* Лёгкий параллакс (только для мыши/трекпада) */
  var fine = window.matchMedia("(pointer: fine)").matches;
  if (!reduce && fine){
    var bg = document.getElementById("bg"), ct = document.getElementById("content");
    var tx=0, ty=0, cx=0, cy=0, raf=0;
    window.addEventListener("pointermove", function(e){
      tx = e.clientX / window.innerWidth - .5;
      ty = e.clientY / window.innerHeight - .5;
      if (!raf) raf = requestAnimationFrame(tick);
    }, {passive:true});
    function tick(){
      cx += (tx-cx)*.08; cy += (ty-cy)*.08;
      bg.style.transform = "translate3d("+(-cx*26).toFixed(1)+"px,"+(-cy*18).toFixed(1)+"px,0) scale(1.04)";
      ct.style.transform = "translate3d("+(cx*10).toFixed(1)+"px,"+(cy*7).toFixed(1)+"px,0)";
      raf = (Math.abs(tx-cx)>.001 || Math.abs(ty-cy)>.001) ? requestAnimationFrame(tick) : 0;
    }
  }
})();
</script>
</body>
</html>
